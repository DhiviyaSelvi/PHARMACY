services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=pharmacy_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    networks:
      - app-network

  web:
    build: .
    command: gunicorn pharmacy_project.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=pharmacy_project.settings.production
      - DEBUG=0
      - SECRET_KEY=production-secret-key
      - DB_NAME=pharmacy_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - RAZOR_KEY_ID=your_razor_key
      - RAZOR_KEY_SECRET=your_razor_secret
    depends_on:
      - db
      - redis
    networks:
      - app-network

  celery_worker:
    build: .
    command: celery -A pharmacy_project worker -l info
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=pharmacy_project.settings.production
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=db
      - DB_NAME=pharmacy_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - db
      - redis
    networks:
      - app-network

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      - web
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
