{% extends 'base.html' %}
{% block title %}Login - PharmaCare{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Login</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
    <br>
    <a href="{% url 'signup' %}">Create Account</a>
</div>
{% endblock %}
