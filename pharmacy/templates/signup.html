{% extends 'base.html' %}
{% block title %}Signup - PharmaCare{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Signup</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Signup</button>
    </form>
    <br>
    <a href="{% url 'login' %}">Already have account? Login</a>
</div>
{% endblock %}
