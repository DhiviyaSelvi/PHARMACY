{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Checkout</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

<div class="checkout-container">

    <h1>Checkout</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <h2>Total: ₹ {{ total }}</h2>

        <button type="submit">

            Place Order

        </button>

    </form>

</div>

</body>

</html>
